<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日桶 · Daily Bin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --text: #1A1A1A;
  --accent: #8B6F47;
  --line: rgba(139, 111, 71, 0.25);
  --muted: rgba(26, 26, 26, 0.45);
  --hover: rgba(139, 111, 71, 0.08);
  --danger: #8B3A3A;
  --input-bg: rgba(139, 111, 71, 0.04);
  --star: #B8860B;
}
[data-theme="dark"] {
  --bg: #111111;
  --text: #E8E4DC;
  --accent: #C4A96A;
  --line: rgba(196, 169, 106, 0.3);
  --muted: rgba(232, 228, 220, 0.4);
  --hover: rgba(196, 169, 106, 0.1);
  --danger: #C46A6A;
  --input-bg: rgba(196, 169, 106, 0.06);
  --star: #D4A94A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "EB Garamond", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  transition: background 0.3s, color 0.3s;
}

#app {
  width: 100%;
  max-width: 640px;
  padding: 32px 24px 80px;
}

/* 顶栏 */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.clock {
  font-size: 32px;
  font-weight: normal;
  letter-spacing: 0.02em;
  line-height: 1.1;
}
.date {
  font-size: 14px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.06em;
}
.top-actions {
  display: flex;
  gap: 16px;
  font-size: 13px;
}
.top-actions button {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.top-actions button:hover {
  color: var(--text);
}

/* 主区域 */
.main {
  margin-top: 48px;
}
.prompt {
  font-size: 20px;
  letter-spacing: 0.04em;
  margin-bottom: 32px;
}
.input-row {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
#entry-input {
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 17px;
  padding: 8px 0;
  outline: none;
  letter-spacing: 0.03em;
  transition: border-color 0.3s;
}
#entry-input:focus {
  border-color: var(--accent);
}
#entry-input::placeholder {
  color: var(--muted);
}
.btn-primary {
  align-self: flex-start;
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 0.12em;
  padding: 10px 32px;
  cursor: pointer;
  transition: background 0.25s, color 0.25s;
}
.btn-primary:hover {
  background: var(--accent);
  color: var(--bg);
}

/* 列表 */
.divider {
  border: none;
  border-top: 1px solid var(--line);
  margin: 40px 0 24px;
}
.section-label {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-bottom: 16px;
}
.entry-list {
  list-style: none;
}
.entry-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(139, 111, 71, 0.1);
  position: relative;
}
[data-theme="dark"] .entry-item {
  border-bottom-color: rgba(196, 169, 106, 0.12);
}
.entry-time {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  letter-spacing: 0.05em;
  min-width: 44px;
}
.entry-text {
  flex: 1;
  font-size: 16px;
  letter-spacing: 0.02em;
  line-height: 1.5;
  word-break: break-word;
}
.entry-star {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--muted);
  padding: 0 2px;
  opacity: 0.4;
  transition: opacity 0.2s, color 0.2s;
  line-height: 1;
}
.entry-star:hover {
  opacity: 1;
}
.entry-star.starred {
  color: var(--star);
  opacity: 1;
}
.entry-delete {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 0 2px;
  line-height: 1;
  opacity: 0.4;
  transition: opacity 0.2s, color 0.2s;
}
.entry-delete:hover {
  opacity: 1;
  color: var(--danger);
}
.entry-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.entry-tag {
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 1px 8px;
  cursor: pointer;
  background: none;
  font-family: inherit;
  transition: color 0.2s, border-color 0.2s;
}
.entry-tag:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.entry-content-wrapper {
  flex: 1;
}
.empty-hint {
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.04em;
  padding: 16px 0;
}

/* 底部导航 */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 48px;
  padding: 14px 0 18px;
  background: var(--bg);
  border-top: 1px solid var(--line);
  z-index: 10;
  transition: background 0.3s;
}
.footer-nav button {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.12em;
  padding: 6px 0;
  border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.footer-nav button:hover {
  color: var(--text);
}
.footer-nav button.active {
  color: var(--accent);
  border-color: var(--accent);
}

/* 底部操作 */
.footer-actions-group {
  margin-top: 32px;
  padding-bottom: 20px;
}
.footer-actions-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.footer-actions-row + .footer-actions-row {
  margin-top: 12px;
}
.footer-actions-row-secondary .btn-text {
  font-size: 12px;
  opacity: 0.7;
}
.footer-actions {
  display: flex;
  gap: 16px;
  margin-top: 32px;
  flex-wrap: wrap;
  padding-bottom: 20px;
}
.btn-text {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.btn-text:hover {
  color: var(--text);
  border-color: var(--accent);
}

/* 清点模式 */
.review-item {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}
.review-item .entry-text {
  font-size: 17px;
}
.review-actions {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.review-actions button {
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 6px 18px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.review-actions .keep:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.review-actions .discard:hover {
  border-color: var(--danger);
  color: var(--danger);
}
.review-actions .transfer:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--hover);
}
.review-actions .decided {
  opacity: 0.4;
  pointer-events: none;
}
.review-done {
  margin-top: 32px;
}

/* 随记 */
#note-input {
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  padding: 16px;
  outline: none;
  letter-spacing: 0.03em;
  line-height: 1.6;
  width: 100%;
  min-height: 120px;
  resize: vertical;
  transition: border-color 0.3s;
}
#note-input:focus {
  border-color: var(--accent);
}
#note-input::placeholder {
  color: var(--muted);
}
.note-group {
  margin-bottom: 36px;
}
.note-date {
  font-size: 14px;
  color: var(--text);
  letter-spacing: 0.06em;
  margin-bottom: 4px;
  padding: 10px 0 6px;
  opacity: 0.7;
}
.note-item {
  padding: 16px 0;
  border-bottom: 1px solid rgba(139, 111, 71, 0.1);
}
[data-theme="dark"] .note-item {
  border-bottom-color: rgba(196, 169, 106, 0.12);
}
.note-time {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.note-text {
  font-size: 16px;
  line-height: 1.7;
  letter-spacing: 0.02em;
  white-space: pre-wrap;
  word-break: break-word;
}
.note-actions {
  display: flex;
  gap: 16px;
  margin-top: 12px;
}
.note-actions button {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 2px 0;
  border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.note-actions button:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.note-actions .delete-note:hover {
  color: var(--danger);
  border-color: var(--danger);
}
.note-edit-area {
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  padding: 12px;
  outline: none;
  letter-spacing: 0.03em;
  line-height: 1.6;
  width: 100%;
  min-height: 80px;
  resize: vertical;
  margin-top: 8px;
}
.note-edit-area:focus {
  border-color: var(--accent);
}
.note-edit-actions {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}
.note-edit-actions button {
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 4px 14px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.note-edit-actions .save-edit:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.note-edit-actions .cancel-edit:hover {
  border-color: var(--danger);
  color: var(--danger);
}
.note-star {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--muted);
  padding: 0 2px;
  opacity: 0.4;
  transition: opacity 0.2s, color 0.2s;
  line-height: 1;
}
.note-star:hover {
  opacity: 1;
}
.note-star.starred {
  color: var(--star);
  opacity: 1;
}

/* 搜索 */
.search-row {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}
#search-input {
  flex: 1;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  padding: 8px 0;
  outline: none;
  letter-spacing: 0.03em;
  transition: border-color 0.3s;
}
#search-input:focus {
  border-color: var(--accent);
}
#search-input::placeholder {
  color: var(--muted);
}
.search-result-item {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.search-result-meta {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.search-result-text {
  font-size: 16px;
  line-height: 1.6;
  word-break: break-word;
}

/* 随机回看弹窗 */
.random-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20;
  padding: 24px;
}
.random-card {
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 32px 24px;
  max-width: 480px;
  width: 100%;
}
.random-card .random-label {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-bottom: 16px;
}
.random-card .random-text {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 24px;
  word-break: break-word;
  white-space: pre-wrap;
}
.random-card .random-meta {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 24px;
}
.random-card .random-actions {
  display: flex;
  gap: 16px;
}
.random-card .random-actions button {
  background: none;
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 8px 20px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.random-card .random-actions button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* 标签管理 */
.tag-filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  align-items: center;
}
.tag-manage-btn {
  margin-left: auto;
  opacity: 0.5;
  font-size: 11px;
}
.tag-manage-btn:hover {
  opacity: 1;
}
.tag-filter-btn {
  background: none;
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.05em;
  padding: 3px 12px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.tag-filter-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.tag-filter-btn.active {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
}

/* 历史 */
.history-group {
  margin-bottom: 32px;
}
.history-date {
  font-size: 14px;
  color: var(--text);
  letter-spacing: 0.06em;
  margin-bottom: 4px;
  padding: 10px 0 6px;
  opacity: 0.7;
}
.history-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  align-items: baseline;
}
.history-status {
  font-size: 12px;
  letter-spacing: 0.08em;
  min-width: 36px;
  color: var(--muted);
}
.history-status.kept {
  color: var(--accent);
}
.history-status.discarded {
  color: var(--danger);
  opacity: 0.6;
}
.history-status.transferred {
  color: var(--accent);
  opacity: 0.8;
}
.history-item .entry-time {
  min-width: 40px;
}
.history-star-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--star);
  font-size: 16px;
  margin-left: auto;
  opacity: 0.8;
  padding: 0 4px;
  font-family: inherit;
  transition: opacity 0.2s;
}
.history-star-btn:hover {
  opacity: 1;
}

/* 木鱼 */
.fish-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  gap: 32px;
  margin-top: 24px;
}
.fish-count {
  font-size: 56px;
  font-weight: normal;
  letter-spacing: 0.05em;
  color: var(--text);
  user-select: none;
}
.fish-btn {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: none;
  cursor: pointer;
  transition: transform 0.05s, background 0.2s;
  outline: none;
  position: relative;
}
.fish-btn:hover {
  background: var(--hover);
}
.fish-btn:active {
  transform: scale(0.92);
}
.fish-zen-save {
  opacity: 0.6;
  font-size: 12px;
}
.fish-zen-save:hover {
  opacity: 1;
}
.fish-zen {
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-align: center;
  min-height: 24px;
  max-width: 320px;
  transition: opacity 0.4s;
  opacity: 0.7;
}
.fish-marks {
  width: 100%;
  max-width: 320px;
  margin-top: 24px;
}
.fish-mark-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  gap: 12px;
}
.fish-mark-count {
  font-size: 24px;
  letter-spacing: 0.03em;
  color: var(--accent);
}
.fish-mark-time {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.fish-mark-delete {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  opacity: 0.4;
  font-family: inherit;
  transition: opacity 0.2s, color 0.2s;
}
.fish-mark-delete:hover {
  opacity: 1;
  color: var(--danger);
}
.fish-btn::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.6;
}

/* 折叠分组 */
.collapse-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  cursor: pointer;
  padding: 14px 0 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
  user-select: none;
  transition: color 0.2s;
  font-size: 16px;
  letter-spacing: 0.08em;
  font-weight: 500;
}
.collapse-header:hover {
  color: var(--accent);
}
.collapse-header .collapse-arrow {
  font-size: 14px;
  color: var(--muted);
  transition: transform 0.3s;
  display: inline-block;
  opacity: 0.6;
}
.collapse-header.collapsed .collapse-arrow {
  transform: rotate(-90deg);
}
.collapse-content {
  overflow: hidden;
}
.collapse-content.collapsed {
  display: none;
}

/* 批量编辑 */
.batch-bar {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.batch-checkbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.batch-mode .entry-item,
.batch-mode .note-item,
.batch-mode .history-item {
  padding-left: 0;
}
.batch-mode .history-item {
  align-items: center;
}
.batch-checkbox-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.batch-checkbox-cell .entry-text,
.batch-checkbox-cell .note-text {
  flex: 1;
}
.batch-selected-count {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

.hidden { display: none; }

@media (max-width: 480px) {
  #app { padding: 20px 16px 80px; }
  .clock { font-size: 26px; }
  .main { margin-top: 32px; }
  .prompt { font-size: 17px; }
  .footer-nav { gap: 32px; }
}
</style>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap">
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div>
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date"></div>
    </div>
    <div class="top-actions">
      <button id="theme-btn" data-i18n="theme">夜间</button>
      <button id="lang-btn">EN</button>
    </div>
  </div>

  <!-- 主视图：桶 -->
  <div id="main-view">
    <div class="main">
      <div class="prompt" data-i18n="prompt">今天有什么想记的？</div>
      <div class="input-row">
        <input type="text" id="entry-input" data-i18n-placeholder="placeholder" placeholder="想到什么，扔进来" autocomplete="off">
        <button class="btn-primary" id="add-btn" data-i18n="add">扔进去</button>
      </div>
    </div>

      function renderOnThisDay() {
    const list = $('onthisday-list');
    const empty = $('onthisday-empty');
    list.innerHTML = '';
    
    const now = new Date();
    const currentMMDD = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const currentYear = now.getFullYear();
    
    // 收集所有非 pending 的 entries 和所有 notes
    const allItems = [];
    entries.filter(e => e.status !== 'pending').forEach(e => {
      allItems.push({ text: e.text, date: e.date, time: e.time, type: 'entry', status: e.status });
    });
    notes.forEach(n => {
      allItems.push({ text: n.text, date: n.date, time: n.time, type: 'note' });
    });
    
    // 筛选：月-日相同，但年份不同
    const matched = allItems.filter(item => {
      if (!item.date) return false;
      const parts = item.date.split('-');
      if (parts.length !== 3) return false;
      const itemMMDD = `${parts[1]}-${parts[2]}`;
      const itemYear = parseInt(parts[0]);
      return itemMMDD === currentMMDD && itemYear !== currentYear;
    });
    
    if (matched.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    
    // 按年份分组
    const yearGroups = {};
    matched.forEach(item => {
      const year = item.date.split('-')[0];
      if (!yearGroups[year]) yearGroups[year] = [];
      yearGroups[year].push(item);
    });
    
    Object.keys(yearGroups).sort().reverse().forEach(year => {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'history-group';
      
      const yearDiv = document.createElement('div');
      yearDiv.className = 'history-date';
      yearDiv.textContent = `${year}${prefs.lang === 'zh' ? '年' : ''}`;
      groupDiv.appendChild(yearDiv);
      
      yearGroups[year].forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'history-item';
        
        const typeSpan = document.createElement('span');
        typeSpan.className = 'history-status';
        typeSpan.textContent = item.type === 'entry' ? t('nav_bin') : t('nav_note');
        if (item.type === 'entry' && item.status === 'kept') {
          typeSpan.classList.add('kept');
        } else if (item.type === 'entry' && item.status === 'discarded') {
          typeSpan.classList.add('discarded');
        } else {
          typeSpan.classList.add('transferred');
        }
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'entry-time';
        timeSpan.textContent = item.time;
        
        const textSpan = document.createElement('span');
        textSpan.className = 'entry-text';
        textSpan.textContent = item.text;
        
        itemDiv.appendChild(typeSpan);
        itemDiv.appendChild(timeSpan);
        itemDiv.appendChild(textSpan);
        groupDiv.appendChild(itemDiv);
      });
      
      list.appendChild(groupDiv);
    });
  }

  function getEntryTags() {
    const tagSet = new Set();
    entries.forEach(e => (e.tags || []).forEach(t => tagSet.add(t)));
    return Array.from(tagSet).sort();
  }
  function getNoteTags() {
    const tagSet = new Set();
    notes.forEach(n => (n.tags || []).forEach(t => tagSet.add(t)));
    return Array.from(tagSet).sort();
  }
  function getAllTags() {
    const tagSet = new Set();
    getEntryTags().forEach(t => tagSet.add(t));
    getNoteTags().forEach(t => tagSet.add(t));
    return Array.from(tagSet).sort();
  }

  function renderTagFilters() {
    const entryTags = getEntryTags();
    const noteTags = getNoteTags();
    
    // 桶的标签筛选
    tagFilterRow.innerHTML = '';
    if (entryTags.length > 0) {
      tagFilterRow.classList.remove('hidden');
      const allBtn = document.createElement('button');
      allBtn.className = 'tag-filter-btn' + (currentTagFilter === null ? ' active' : '');
      allBtn.textContent = t('all_tags');
      allBtn.addEventListener('click', () => { currentTagFilter = null; renderAll(); });
      tagFilterRow.appendChild(allBtn);
      entryTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag-filter-btn' + (currentTagFilter === tag ? ' active' : '');
        btn.textContent = tag;
        btn.addEventListener('click', () => { currentTagFilter = tag; renderAll(); });
        tagFilterRow.appendChild(btn);
      });
      const manageBtn = document.createElement('button');
      manageBtn.className = 'tag-filter-btn tag-manage-btn';
      manageBtn.textContent = prefs.lang === 'zh' ? '标签管理' : 'Tag Manage';
      manageBtn.addEventListener('click', () => showTagManage('entry'));
      tagFilterRow.appendChild(manageBtn);
    } else {
      tagFilterRow.classList.add('hidden');
    }

    // 随记的标签筛选
    noteTagFilterRow.innerHTML = '';
    if (noteTags.length > 0) {
      noteTagFilterRow.classList.remove('hidden');
      const allBtn = document.createElement('button');
      allBtn.className = 'tag-filter-btn' + (currentNoteTagFilter === null ? ' active' : '');
      allBtn.textContent = t('all_tags');
      allBtn.addEventListener('click', () => { currentNoteTagFilter = null; renderAll(); });
      noteTagFilterRow.appendChild(allBtn);
      noteTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag-filter-btn' + (currentNoteTagFilter === tag ? ' active' : '');
        btn.textContent = tag;
        btn.addEventListener('click', () => { currentNoteTagFilter = tag; renderAll(); });
        noteTagFilterRow.appendChild(btn);
      });
      const manageBtn = document.createElement('button');
      manageBtn.className = 'tag-filter-btn tag-manage-btn';
      manageBtn.textContent = prefs.lang === 'zh' ? '标签管理' : 'Tag Manage';
      manageBtn.addEventListener('click', () => showTagManage('note'));
      noteTagFilterRow.appendChild(manageBtn);
      // 收藏筛选
      const starBtn = document.createElement('button');
      starBtn.className = 'tag-filter-btn' + (currentNoteTagFilter === '__starred__' ? ' active' : '');
      starBtn.textContent = '★';

  function showTagManage(type) {
    const allTags = type === 'note' ? getNoteTags() : getEntryTags();
    const overlay = document.createElement('div');
    overlay.className = 'random-overlay';
    overlay.style.zIndex = '30';
    
    const card = document.createElement('div');
    card.className = 'random-card';
    
    const label = document.createElement('div');
    label.className = 'random-label';
    label.textContent = prefs.lang === 'zh' ? '管理标签' : 'Manage Tags';
    card.appendChild(label);
    
    allTags.forEach(tag => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);';
      
      const tagName = document.createElement('span');
      tagName.style.cssText = 'font-size:14px;color:var(--text);';
      tagName.textContent = tag;
      
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:12px;';
      
      const renameBtn = document.createElement('button');
      renameBtn.className = 'btn-text';
      renameBtn.textContent = prefs.lang === 'zh' ? '重命名' : 'Rename';
      renameBtn.addEventListener('click', () => {
        const newName = prompt(prefs.lang === 'zh' ? '新标签名：' : 'New tag name:', tag);
        if (newName && newName.trim() && newName.trim() !== tag) {
          // 重命名所有数据里的这个标签
          entries.forEach(e => {
            if (e.tags && e.tags.includes(tag)) {
              e.tags = e.tags.map(t => t === tag ? newName.trim() : t);
            }
          });
          notes.forEach(n => {
            if (n.tags && n.tags.includes(tag)) {
              n.tags = n.tags.map(t => t === tag ? newName.trim() : t);
            }
          });
          saveData();
          overlay.remove();
          renderAll();
        }
      });
      
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-text';
      delBtn.textContent = prefs.lang === 'zh' ? '删除' : 'Delete';
      delBtn.style.color = 'var(--danger)';
      delBtn.addEventListener('click', () => {
        if (confirm(prefs.lang === 'zh' ? `删除标签"${tag}"？所有条目上的这个标签都会被移除。` : `Delete tag "${tag}"? It will be removed from all items.`)) {
          entries.forEach(e => {
            if (e.tags) e.tags = e.tags.filter(t => t !== tag);
          });
          notes.forEach(n => {
            if (n.tags) n.tags = n.tags.filter(t => t !== tag);
          });
          if (currentTagFilter === tag) currentTagFilter = null;
          if (currentNoteTagFilter === tag) currentNoteTagFilter = null;
          saveData();
          overlay.remove();
          renderAll();
        }
      });
      
      actions.appendChild(renameBtn);
      actions.appendChild(delBtn);
      row.appendChild(tagName);
      row.appendChild(actions);
      card.appendChild(row);
    });
    
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn-primary';
    closeBtn.textContent = t('close');
    closeBtn.style.marginTop = '16px';
    closeBtn.addEventListener('click', () => overlay.remove());
    card.appendChild(closeBtn);
    
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }
  function showTagPicker(target, type) {
    const existingTags = type === 'note' ? getNoteTags() : getEntryTags();
    const overlay = document.createElement('div');
    overlay.className = 'random-overlay';
    overlay.style.zIndex = '30';
    
    const card = document.createElement('div');
    card.className = 'random-card';
    
    const label = document.createElement('div');
    label.className = 'random-label';
    label.textContent = t('add_tag');
    card.appendChild(label);
    
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = t('tag_placeholder');
    input.style.cssText = 'background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);font-family:inherit;font-size:16px;padding:8px 0;outline:none;width:100%;margin-bottom:16px;';
    card.appendChild(input);
    
    if (existingTags.length > 0) {
      const tagDiv = document.createElement('div');
      tagDiv.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;';
      existingTags.forEach(tag => {
        const tagBtn = document.createElement('button');
        tagBtn.className = 'tag-filter-btn';
        tagBtn.textContent = tag;
        tagBtn.addEventListener('click', () => {
          if (!target.tags) target.tags = [];
          if (!target.tags.includes(tag)) {
            target.tags.push(tag);
            saveData();
          }
          overlay.remove();
          renderAll();
        });
        tagDiv.appendChild(tagBtn);
      });
      card.appendChild(tagDiv);
    }
    
    const actions = document.createElement('div');
    actions.className = 'random-actions';
    
    const confirmBtn = document.createElement('button');
    confirmBtn.textContent = t('save');
    confirmBtn.addEventListener('click', () => {
      const tagName = input.value.trim();
      if (tagName) {
        if (!target.tags) target.tags = [];
        if (!target.tags.includes(tagName)) {
          target.tags.push(tagName);
          saveData();
        }
      }
      overlay.remove();
      renderAll();
    });
    
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = t('cancel');
    cancelBtn.addEventListener('click', () => {
      overlay.remove();
    });
    
    actions.appendChild(confirmBtn);
    actions.appendChild(cancelBtn);
    card.appendChild(actions);
    
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    input.focus();
  }

      const li = document.createElement('li');
      li.className = 'entry-item';

      timeSpan.className = 'entry-time';
      timeSpan.textContent = e.time;
      
      const contentWrapper = document.createElement('div');
      contentWrapper.className = 'entry-content-wrapper';

      textSpan.className = 'entry-text';

      contentWrapper.appendChild(textSpan);

  function renderHistoryList() {
    let groups = historyGroups();
    if (currentHistoryFilter === 'starred') {
      groups = groups.map(g => ({
        date: g.date,
        items: g.items.filter(e => e.starred)
      })).filter(g => g.items.length > 0);
    }
    historyList.innerHTML = '';
    historyEmpty.classList.toggle('hidden', groups.length !== 0);
    
    const monthGroups = {};
    groups.forEach(g => {
      const month = g.date.substring(0, 7);
      if (!monthGroups[month]) monthGroups[month] = [];
      monthGroups[month].push(g);
    });
    
    const months = Object.keys(monthGroups).sort().reverse();
    months.forEach((month, monthIndex) => {
      const monthDiv = document.createElement('div');
      monthDiv.className = 'history-group';
      
      const header = document.createElement('div');
      header.className = 'collapse-header' + (monthIndex > 1 ? ' collapsed' : '');
      const parts = month.split('-');
      const y = parts[0], m = parseInt(parts[1]);
      const headerText = document.createElement('span');
      headerText.textContent = prefs.lang === 'zh' ? `${y}年${m}月` : `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${y}`;
      const arrow = document.createElement('span');
      arrow.className = 'collapse-arrow';
      arrow.textContent = '▾';
      header.appendChild(headerText);
      header.appendChild(arrow);
      
      const content = document.createElement('div');
      content.className = 'collapse-content' + (monthIndex > 1 ? ' collapsed' : '');
      
      header.addEventListener('click', () => {
        header.classList.toggle('collapsed');
        content.classList.toggle('collapsed');
      });
      
      monthDiv.appendChild(header);
      
      monthGroups[month].forEach(g => {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'history-date';
        const dParts = g.date.split('-');
        const dm = parseInt(dParts[1]), dd = parseInt(dParts[2]);
        if (prefs.lang === 'zh') {
          dateDiv.textContent = `${dm}月${dd}日`;
        } else {
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          dateDiv.textContent = `${months[dm-1]} ${dd}`;
        }
        content.appendChild(dateDiv);
        
        g.items.sort((a,b) => a.time.localeCompare(b.time)).forEach(e => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'history-item';
          
          if (batchMode.history) {
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'batch-checkbox';
            checkbox.checked = batchSelected.history.has(e.id);
            checkbox.addEventListener('change', () => {
              if (checkbox.checked) batchSelected.history.add(e.id);
              else batchSelected.history.delete(e.id);
              updateBatchCount('history');
            });
            itemDiv.appendChild(checkbox);
          }
          
          const statusSpan = document.createElement('span');
          const cls = e.status === 'kept' ? 'kept' : (e.status === 'discarded' ? 'discarded' : 'transferred');
          statusSpan.className = 'history-status ' + cls;
          statusSpan.textContent = t(e.status);
          
          const timeSpan = document.createElement('span');
          timeSpan.className = 'entry-time';
          timeSpan.textContent = e.time;
          
          const textSpan = document.createElement('span');
          textSpan.className = 'entry-text';
          textSpan.textContent = e.text;
          
          itemDiv.appendChild(statusSpan);
          itemDiv.appendChild(timeSpan);
          itemDiv.appendChild(textSpan);
          
          if (e.starred) {
            const starBtn = document.createElement('button');
            starBtn.className = 'history-star-btn';
            starBtn.textContent = '★';
            starBtn.addEventListener('click', () => {
              e.starred = false; saveData(); renderAll();
            });
            itemDiv.appendChild(starBtn);
          }
          
          content.appendChild(itemDiv);
        });
      });
      
      monthDiv.appendChild(content);
      historyList.appendChild(monthDiv);
    });
  }

  function renderSearchResults() {
    const query = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!query) {
      searchEmpty.classList.add('hidden');
      return;
    }
    
    const results = [];
    entries.forEach(e => {
      if (e.text.toLowerCase().includes(query)) {
        results.push({ type: 'entry', date: e.date, time: e.time, text: e.text });
      }
    });
    notes.forEach(n => {
      if (n.text.toLowerCase().includes(query)) {
        results.push({ type: 'note', date: n.date, time: n.time, text: n.text });
      }
    });
    results.sort((a,b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
    
    if (results.length === 0) {
      searchEmpty.classList.remove('hidden');
    } else {
      searchEmpty.classList.add('hidden');
      results.forEach(r => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'search-result-meta';
        const typeLabel = r.type === 'entry' ? t('nav_bin') : t('nav_note');
        metaDiv.textContent = `${typeLabel} · ${r.date} · ${r.time}`;
        
        const textDiv = document.createElement('div');
        textDiv.className = 'search-result-text';
        textDiv.textContent = r.text;
        
        div.appendChild(metaDiv);
        div.appendChild(textDiv);
        searchResults.appendChild(div);
      });
    }
  }

  function updateBatchCount(type) {
    const count = batchSelected[type].size;
    const el = $(`${type}-batch-count`);
    if (el) {
      el.textContent = prefs.lang === 'zh' ? `已选 ${count} 条` : `${count} selected`;
    }
  }
  function exitBatchMode(type) {
    batchMode[type] = false;
    batchSelected[type].clear();
    $(`${type}-batch-toggle`).textContent = t('batch_edit');
    $(`${type}-batch-bar`).classList.add('hidden');
    renderAll();
  }
  function toggleBatchMode(type) {
    batchMode[type] = !batchMode[type];
    batchSelected[type].clear();
    if (batchMode[type]) {
      $(`${type}-batch-toggle`).textContent = prefs.lang === 'zh' ? '完成' : 'Done';
      $(`${type}-batch-bar`).classList.remove('hidden');
    } else {
      $(`${type}-batch-toggle`).textContent = t('batch_edit');
      $(`${type}-batch-bar`).classList.add('hidden');
    }
    renderAll();
  }
  function selectAllInBatch(type) {
    const ids = type === 'note' ? notes.map(n => n.id) : entries.filter(e => e.status !== 'pending').map(e => e.id);
    batchSelected[type] = new Set(ids);
    updateBatchCount(type);
    renderAll();
  }
  function selectNoneInBatch(type) {
    batchSelected[type].clear();
    updateBatchCount(type);
    renderAll();
  }
  function deleteSelectedInBatch(type) {
    if (batchSelected[type].size === 0) return;
    const confirmMsg = prefs.lang === 'zh' ? `确定删除选中的 ${batchSelected[type].size} 条吗？` : `Delete ${batchSelected[type].size} selected items?`;
    if (!confirm(confirmMsg)) return;
    if (type === 'note') {
      notes = notes.filter(n => !batchSelected.note.has(n.id));
    } else {
      entries = entries.filter(e => !batchSelected.history.has(e.id));
    }
    saveData();
    exitBatchMode(type);
  }
  function renderFishMarks() {
    fishMarksEl.innerHTML = '';
    fishMarks.sort((a,b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time)).forEach(m => {
      const div = document.createElement('div');
      div.className = 'fish-mark-item';
      
      const countSpan = document.createElement('span');
      countSpan.className = 'fish-mark-count';
      countSpan.textContent = m.count;
      
      const timeSpan = document.createElement('span');
      timeSpan.className = 'fish-mark-time';
      timeSpan.textContent = `${m.date} ${m.time}`;
      
      const delBtn = document.createElement('button');
      delBtn.className = 'fish-mark-delete';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        fishMarks = fishMarks.filter(x => x !== m);
        saveFishMarks();
        renderFishMarks();
      });
      
      div.appendChild(countSpan);
      div.appendChild(timeSpan);
      div.appendChild(delBtn);
      fishMarksEl.appendChild(div);
    });
  }
  function showRandom() {
    const allItems = [];
    entries.filter(e => e.status === 'kept' || e.status === 'transferred').forEach(e => {
      allItems.push({ text: e.text, date: e.date, time: e.time, type: 'entry' });
    });
    notes.forEach(n => {
      allItems.push({ text: n.text, date: n.date, time: n.time, type: 'note' });
    });
    
    if (allItems.length === 0) {
      randomLabel.textContent = t('random_label');
      randomText.textContent = prefs.lang === 'zh' ? '还没有可以回看的内容。' : 'Nothing to recall yet.';
      randomMeta.textContent = '';
    } else {
      const item = allItems[Math.floor(Math.random() * allItems.length)];
      randomLabel.textContent = t('random_label');
      randomText.textContent = item.text;
      const typeLabel = item.type === 'entry' ? t('nav_bin') : t('nav_note');
      randomMeta.textContent = `${typeLabel} · ${item.date} · ${item.time}`;
    }
    randomOverlay.classList.remove('hidden');
  }

  // ========== 视图切换 ==========
  function showView(view) {
    currentView = view;
    mainView.classList.add('hidden');
    noteView.classList.add('hidden');
    reviewView.classList.add('hidden');
    historyView.classList.add('hidden');
    searchView.classList.add('hidden');
    onthisdayView.classList.add('hidden');
    fishView.classList.add('hidden');
    if (view === 'main') mainView.classList.remove('hidden');
    if (view === 'note') noteView.classList.remove('hidden');
    if (view === 'review') reviewView.classList.remove('hidden');
    if (view === 'history') historyView.classList.remove('hidden');
    if (view === 'search') searchView.classList.remove('hidden');
    if (view === 'onthisday') onthisdayView.classList.remove('hidden');
    if (view === 'fish') fishView.classList.remove('hidden');
    
    navBin.classList.toggle('active', view === 'main' || view === 'review' || view === 'history' || view === 'search');
    navNote.classList.toggle('active', view === 'note');
    navFish.classList.toggle('active', view === 'fish');
    
    renderAll();
  }

  // ========== 操作 ==========
  function addEntry() {
    const text = entryInput.value.trim();
    if (!text) return;
    entries.push({ id: uid(), text, time: timeStr(), date: todayStr(), status: 'pending', starred: false, tags: [] });
    saveData();
    entryInput.value = '';
    renderAll();
    entryInput.focus();
  }

  function addNote() {
    const text = noteInput.value.trim();
    if (!text) return;
    notes.push({ id: uid(), text, time: timeStr(), date: todayStr(), starred: false, tags: [] });
    saveData();
    noteInput.value = '';
    renderAll();
    noteInput.focus();
  }

  function exportData() {
    const data = JSON.stringify({ entries, notes }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `daily-bin-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (data.entries && Array.isArray(data.entries)) {
          entries = data.entries;
        } else if (Array.isArray(data)) {
          entries = data;
        } else {
          alert(t('import_error'));
          return;
        }
        if (data.notes && Array.isArray(data.notes)) {
          notes = data.notes;
        }
        entries.forEach(e => { if (e.starred === undefined) e.starred = false; if (!e.tags) e.tags = []; });
        notes.forEach(n => { if (n.starred === undefined) n.starred = false; if (!n.tags) n.tags = []; });
        saveData();
        renderAll();
      } catch(err) {
        alert(t('import_error'));
      }
    };
    reader.readAsText(file);
  }

  // ========== 事件绑定 ==========
  $('add-btn').addEventListener('click', addEntry);
  entryInput.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });

  $('note-add-btn').addEventListener('click', addNote);
  noteInput.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addNote(); });

  $('review-btn').addEventListener('click', () => showView('review'));
  $('review-finish-btn').addEventListener('click', () => showView('main'));

  $('history-btn').addEventListener('click', () => showView('history'));
    $('history-filter-all').addEventListener('click', () => {
    currentHistoryFilter = 'all';
    $('history-filter-all').classList.add('active');
    $('history-filter-starred').classList.remove('active');
    renderHistoryList();
  });
  $('history-filter-starred').addEventListener('click', () => {
    currentHistoryFilter = 'starred';
    $('history-filter-starred').classList.add('active');
    $('history-filter-all').classList.remove('active');
    renderHistoryList();
  });
  $('history-clear-btn').addEventListener('click', () => {
    if (confirm(t('confirm_clear'))) {
      entries = entries.filter(e => e.status === 'pending');
      saveData();
      renderAll();
    }
  });

  $('search-btn').addEventListener('click', () => {
    showView('search');
    searchInput.focus();
  });
  searchInput.addEventListener('input', renderSearchResults);

  $('random-btn').addEventListener('click', showRandom);
  $('onthisday-btn').addEventListener('click', () => {
    showView('onthisday');
    renderOnThisDay();
  });
  $('onthisday-btn').addEventListener('click', () => {
    showView('onthisday');
    renderOnThisDay();
  });
  $('random-close-btn').addEventListener('click', () => randomOverlay.classList.add('hidden'));
  $('random-again-btn').addEventListener('click', showRandom);
  randomOverlay.addEventListener('click', e => {
    if (e.target === randomOverlay) randomOverlay.classList.add('hidden');
  });

  $('export-btn').addEventListener('click', exportData);
  $('import-btn').addEventListener('click', () => $('import-file').click());
  $('import-file').addEventListener('change', e => {
    if (e.target.files.length > 0) {
      importData(e.target.files[0]);
      e.target.value = '';
    }
  });

  themeBtn.addEventListener('click', () => {
    prefs.theme = prefs.theme === 'light' ? 'dark' : 'light';
    savePrefs();
    applyTheme();
  });

  langBtn.addEventListener('click', () => {
    prefs.lang = prefs.lang === 'zh' ? 'en' : 'zh';
    savePrefs();
    applyLang();
  });

  navBin.addEventListener('click', () => showView('main'));
  navNote.addEventListener('click', () => showView('note'));
  navFish.addEventListener('click', () => showView('fish'));

  // 木鱼音效
  let audioCtx = null;
  function playFishSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtx;
      const now = ctx.currentTime;
      
      // 主敲击：低频短促
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(180, now);
      osc1.frequency.exponentialRampToValueAtTime(80, now + 0.08);
      gain1.gain.setValueAtTime(0.7, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.12);
      
      // 木质共鸣层：更短的脉冲
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(400, now);
      osc2.frequency.exponentialRampToValueAtTime(120, now + 0.04);
      gain2.gain.setValueAtTime(0.4, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.08);
    } catch(e) {
      // 忽略音频错误
    }
  }

  fishBtn.addEventListener('click', () => {
    fishCount++;
    fishCountEl.textContent = fishCount;
    saveFish();
    playFishSound();
    if (fishCount % 3 === 0) {
      showZen();
    }
  });
    fishMarkBtn.addEventListener('click', () => {
    fishMarks.push({
      count: fishCount,
      time: timeStrSec(),
      date: todayStr()
    });
    saveFishMarks();
    renderFishMarks();
  });
    fishZenSaveBtn.addEventListener('click', () => {
    if (!currentZen) return;
    notes.push({
      id: uid(),
      text: currentZen,
      time: timeStr(),
      date: todayStr(),
      starred: false,
      tags: ['禅语']
    });
    saveData();
    fishZenSaveBtn.classList.add('hidden');
    renderAll();
  });
    // ========== 昨日未清点提醒 ==========
  function checkYesterdayUnreviewed() {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
    const unreviewed = entries.filter(e => e.date === yStr && e.status === 'pending');
    if (unreviewed.length === 0) return;
    
    const msg = prefs.lang === 'zh' 
      ? `昨日有 ${unreviewed.length} 条未清点，现在处理吗？` 
      : `You have ${unreviewed.length} unreviewed items from yesterday. Review now?`;
    
    if (confirm(msg)) {
      // 把昨天的未清点合并到今天
      const today = todayStr();
      unreviewed.forEach(e => {
        e.date = today;
      });
      saveData();
      showView('review');
    } else {
      // 全部丢弃
      unreviewed.forEach(e => {
        e.status = 'discarded';
      });
      saveData();
      renderAll();
    }
  }
  // ========== 初始化 ==========
  loadPrefs();
  loadData();
  applyTheme();
  applyLang();
  updateClock();
  setInterval(updateClock, 1000);
  renderAll();
  fishCountEl.textContent = fishCount;
  renderFishMarks();
  showZen();
  checkYesterdayUnreviewed();
  
  // ========== 批量编辑事件绑定 ==========
  function bindBatchEvents() {
    const noteToggle = $('note-batch-toggle');
    const noteBar = $('note-batch-bar');
    const noteAll = $('note-batch-all');
    const noteNone = $('note-batch-none');
    const noteDelete = $('note-batch-delete');
    const noteCount = $('note-batch-count');
    
    const historyToggle = $('history-batch-toggle');
    const historyBar = $('history-batch-bar');
    const historyAll = $('history-batch-all');
    const historyNone = $('history-batch-none');
    const historyDelete = $('history-batch-delete');
    const historyCount = $('history-batch-count');
    
    if (noteToggle) {
      noteToggle.addEventListener('click', () => {
        batchMode.note = !batchMode.note;
        batchSelected.note.clear();
        if (batchMode.note) {
          noteToggle.textContent = prefs.lang === 'zh' ? '完成' : 'Done';
          noteBar.classList.remove('hidden');
        } else {
          noteToggle.textContent = t('batch_edit');
          noteBar.classList.add('hidden');
        }
        renderAll();
      });
    }
    if (noteAll) {
      noteAll.addEventListener('click', () => {
        batchSelected.note = new Set(notes.map(n => n.id));
        renderAll();
      });
    }
    if (noteNone) {
      noteNone.addEventListener('click', () => {
        batchSelected.note.clear();
        renderAll();
      });
    }
    if (noteDelete) {
      noteDelete.addEventListener('click', () => {
        if (batchSelected.note.size === 0) return;
        if (!confirm(prefs.lang === 'zh' ? `确定删除选中的 ${batchSelected.note.size} 条吗？` : `Delete ${batchSelected.note.size} selected items?`)) return;
        notes = notes.filter(n => !batchSelected.note.has(n.id));
        saveData();
        batchMode.note = false;
        batchSelected.note.clear();
        noteToggle.textContent = t('batch_edit');
        noteBar.classList.add('hidden');
        renderAll();
      });
    }
    
    if (historyToggle) {
      historyToggle.addEventListener('click', () => {
        batchMode.history = !batchMode.history;
        batchSelected.history.clear();
        if (batchMode.history) {
          historyToggle.textContent = prefs.lang === 'zh' ? '完成' : 'Done';
          historyBar.classList.remove('hidden');
        } else {
          historyToggle.textContent = t('batch_edit');
          historyBar.classList.add('hidden');
        }
        renderAll();
      });
    }
    if (historyAll) {
      historyAll.addEventListener('click', () => {
        batchSelected.history = new Set(entries.filter(e => e.status !== 'pending').map(e => e.id));
        renderAll();
      });
    }
    if (historyNone) {
      historyNone.addEventListener('click', () => {
        batchSelected.history.clear();
        renderAll();
      });
    }
    if (historyDelete) {
      historyDelete.addEventListener('click', () => {
        if (batchSelected.history.size === 0) return;
        if (!confirm(prefs.lang === 'zh' ? `确定删除选中的 ${batchSelected.history.size} 条吗？` : `Delete ${batchSelected.history.size} selected items?`)) return;
        entries = entries.filter(e => !batchSelected.history.has(e.id));
        saveData();
        batchMode.history = false;
        batchSelected.history.clear();
        historyToggle.textContent = t('batch_edit');
        historyBar.classList.add('hidden');
        renderAll();
      });
    }
  }
  
  bindBatchEvents();
})();
</script>
